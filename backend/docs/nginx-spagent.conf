# SpAgent production Nginx reverse proxy template
# Express MUST bind to HOST=127.0.0.1 and set TRUST_PROXY=true behind this single proxy.
# Place limit_req_zone directives inside http { ... } (e.g., /etc/nginx/conf.d/spagent-zones.conf):
#
#   limit_req_zone $binary_remote_addr zone=spagent_api:10m rate=15r/s;
#   limit_req_zone $binary_remote_addr zone=spagent_auth:10m rate=5r/m;
#   limit_req_zone $binary_remote_addr zone=spagent_ai:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # Keep ACME challenge open for Certbot, redirect everything else to HTTPS once TLS is ready
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uncomment after installing TLS certificate via certbot --nginx:
    # return 301 https://$host$request_uri;

    # --- If running temporary HTTP-only on IP before domain binding, include the locations below ---
    server_tokens off;
    root /var/www/spagent/frontend/dist;
    index index.html;

    # Silently drop automated vulnerability scanners & secret probes
    location ~* /(\.env|\.git|\.htaccess|wp-login\.php|wp-admin|xmlrpc\.php|phpinfo|phpmyadmin|\.(php|asp|aspx|jsp|sql|bak|swp)$) {
        return 444;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    location /downloads/ {
        try_files $uri =404;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional production AMap JS API 2.0 security proxy (keeps AMAP_SECURITY_CODE off the browser)
    # Set AMAP_SERVICE_HOST=https://your-domain.example/_AMapService in backend/.env
    # location /_AMapService/ {
    #     set $args "$args&jscode=REPLACE_WITH_AMAP_SECURITY_CODE";
    #     proxy_pass https://restapi.amap.com/;
    #     proxy_ssl_server_name on;
    # }

    # AI Coach SSE streaming endpoint (disable proxy buffering for real-time tokens)
    location = /api/agent/coach/stream {
        # limit_req zone=spagent_ai burst=4 nodelay;
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8080/api/agent/coach/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 120s;
    }

    # Authentication endpoints (stricter limit)
    location ~ ^/api/auth/(login|register)$ {
        # limit_req zone=spagent_auth burst=5 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # limit_req zone=spagent_api burst=30 nodelay;
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

