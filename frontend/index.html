<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SpAgent 个人运动与健康管理" />
    <meta name="theme-color" content="#15b66a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SpAgent" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/spagent-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/spagent-maskable.png" />
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0f1014;
        color: #f7f6ef;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot-splash__inner {
        display: grid;
        justify-items: center;
        gap: 14px;
      }
      .boot-splash__mark {
        display: block;
        width: 112px;
        height: 112px;
        border-radius: 24px;
      }
      .boot-splash__title {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0;
      }
    </style>
    <title>SpAgent</title>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" aria-label="SpAgent 启动中">
        <div class="boot-splash__inner">
          <img class="boot-splash__mark" src="/icons/spagent-icon.png" alt="" />
          <div class="boot-splash__title">SpAgent</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
